<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>My TV · 看一部好故事</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/hls.min.js" defer></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6 7-1 1a4.25 4.25 0 0 1-6-6l4-4a4.25 4.25 0 0 1 6 0m2-1 1-1a4.25 4.25 0 0 1 6 6l-4 4a4.25 4.25 0 0 1-6 0"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="My TV 首页"><span class="brand-mark"><svg><use href="#i-play"/></svg></span><span>my<span class="brand-tv">tv</span><span class="brand-dot">.</span></span></a>
      <div class="nav-label">你的放映室</div>
      <nav aria-label="主导航">
        <button class="nav-item active" id="home-nav" aria-label="发现"><svg><use href="#i-grid"/></svg><span>发现</span></button>
        <button class="nav-item" id="history-nav" aria-label="观看历史"><svg><use href="#i-history"/></svg><span>观看历史</span></button>
        <button class="nav-item" id="direct-nav" aria-label="链接播放"><svg><use href="#i-link"/></svg><span>链接播放</span></button>
      </nav>
      <div class="config-sidebar">
        <div class="config-sidebar-heading"><span>TVBox 配置</span><button id="add-config" class="icon-button" aria-label="导入自定义配置">＋</button></div>
        <select id="config-select" aria-label="TVBox 配置"></select>
      </div>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="status-dot"></span>私人放映室<span id="source-count" hidden>正在连接…</span></div>
      </div>
    </aside>
    <main>
      <section id="browse-view">
        <header class="topbar">
          <span class="page-label">发现</span>
          <form id="search-form" class="search-form" role="search">
            <svg><use href="#i-search"/></svg>
            <input id="search-input" type="search" placeholder="搜索电影、剧集、动漫" aria-label="搜索影片" maxlength="120" autocomplete="off">
            <button class="search-submit" type="submit">搜索</button>
          </form>
        </header>
        <div class="browse-body">
          <div class="intro-row">
            <div><h1 id="catalog-title">看一部好故事</h1><p class="intro-caption" id="catalog-caption">电影、剧集、动漫，选一部开始。</p></div>
            <div class="config-summary"><span>当前配置</span><strong id="config-name">全部</strong><small id="config-summary">正在读取…</small></div>
          </div>
          <details id="aggregate-info" class="error-details aggregate-info" hidden><summary id="aggregate-info-summary"></summary><p id="aggregate-info-text"></p></details>
          <section id="continue-section" class="continue-section" hidden><div class="continue-heading"><h2>继续观看</h2><button id="all-history" class="text-button">全部历史 ↗</button></div><div id="continue-card"></div></section>
          <div id="filter-row" class="filter-row">
            <div id="category-chips" class="category-chips" aria-label="影片分类"><button class="chip selected" data-category="">全部</button></div>
            <select id="category-select" aria-label="更多影片分类" hidden></select>
          </div>
          <div class="result-topline"><span id="result-count">正在获取影片…</span><div class="result-actions"><button id="stop-search" class="text-button" hidden>暂停搜索</button><button id="clear-search" class="text-button" hidden>返回片库</button><button id="refresh-library" class="text-button">换个片库</button></div></div>
          <p id="search-progress" class="search-progress" role="status" aria-live="polite" hidden></p>
          <div id="search-source-filters" class="search-source-filters" aria-label="按片源筛选搜索结果" hidden></div>
          <div id="catalog-status" class="empty-state" aria-live="polite" hidden>
            <div class="empty-icon"><svg><use href="#i-grid"/></svg></div><h2 id="status-title"></h2><p id="status-message"></p>
            <details id="catalog-error-details" class="error-details" hidden><summary>查看详情</summary><p id="catalog-error-detail"></p></details><div class="empty-actions"><button id="catalog-retry" class="button primary">重新加载</button><button id="status-configs" class="button secondary">选择配置</button><button id="config-alternative" class="button secondary" hidden></button></div>
          </div>
          <div id="poster-grid" class="poster-grid" aria-label="影片列表"></div>
          <div id="search-results" class="search-results" aria-label="按片源分组的搜索结果" hidden></div>
          <div class="pagination" id="pagination" hidden><button id="previous-page" class="button secondary">上一页</button><span id="page-indicator"></span><button id="next-page" class="button secondary">下一页</button></div>

        </div>
      </section>
      <section id="history-view" hidden><header class="topbar"><span class="page-label">观看历史</span><button id="history-back" class="text-button">返回发现</button></header><div class="browse-body"><h1>观看历史</h1>
        <div class="history-tools"><form id="history-search-form" class="history-search" role="search" aria-label="搜索观看历史"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="history-search" type="search" placeholder="搜索看过的影片" aria-label="搜索历史影片名称" maxlength="200"><button type="submit">搜索</button></form><button id="history-clear" class="history-delete" disabled>清空历史</button></div>
        <p id="history-message" class="intro-caption" role="status"></p><details id="history-error-details" class="error-details" hidden><summary>查看详情</summary><p id="history-error-detail"></p></details><div id="history-list" class="history-list"></div>
        <nav id="history-pagination" class="pagination" aria-label="观看历史分页" hidden><button id="history-previous" class="button secondary">上一页</button><span id="history-page-label"></span><button id="history-next" class="button secondary">下一页</button></nav>
      </div></section>
      <section id="watch-view" hidden>
        <header class="watch-topbar"><button id="watch-back" class="back-button"><svg><use href="#i-arrow"/></svg>返回发现</button><span id="watch-source" class="watch-source"></span></header>
        <div class="watch-layout">
          <div class="watch-main">
            <div id="video-stage" class="video-stage">
              <video id="video" controls playsinline preload="metadata" aria-label="影片播放器"></video>
              <div id="video-placeholder" class="video-placeholder"><span class="brand-mark large"><svg><use href="#i-play"/></svg></span><span>准备播放</span></div>
              <div id="seek-feedback" class="seek-feedback" role="status" hidden></div>
              <div id="player-controls" class="player-controls" hidden>
                <div class="seek-wrap"><output id="seek-tooltip" class="seek-tooltip" hidden></output><input id="player-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度" disabled></div>
                <div class="player-toolbar">
                  <button id="player-toggle" class="player-button" aria-label="播放" title="播放 / 暂停（空格）">▶</button>
                  <span id="player-time" class="player-time">00:00 / 00:00</span>
                  <div class="player-toolbar-spacer"></div>
                  <button id="player-mute" class="player-button" aria-label="静音" title="静音（M）">♪</button>
                  <input id="player-volume" class="player-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量">
                  <select id="player-quality" class="player-speed" aria-label="画质" title="选择片源提供的画质" hidden></select>
                  <select id="player-speed" class="player-speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
                  <button id="player-fullscreen" class="player-button" aria-label="全屏" title="全屏（F）">⛶</button>
                </div>
              </div>
            </div>
            <div class="player-status-row"><span id="player-status" role="status" aria-live="polite">正在加载影片…</span><span id="video-quality" class="video-quality"></span><button id="next-episode" class="text-button" disabled><svg><use href="#i-next"/></svg>下一集</button></div>
            <p id="history-save-status" class="history-save-status" role="status"></p><p id="resume-notice" class="resume-notice" hidden></p>
            <details id="playback-info" class="error-details playback-info" hidden><summary>播放信息</summary><p id="playback-info-text"></p></details>
            <div class="error-banner" id="play-error" role="alert" hidden><span id="play-error-text"></span><button id="play-alternate" class="button secondary small" hidden>尝试备用线路</button><button id="play-retry" class="button secondary small">重试播放</button></div>
            <details id="play-error-details" class="error-details" hidden><summary>查看详情</summary><p id="play-error-detail"></p></details><div class="watch-info"><h1 id="watch-title"></h1><p class="watch-meta" id="watch-meta"></p><p id="watch-actors" class="watch-actors"></p></div>
          </div>
          <aside class="episode-panel">
            <div class="episode-heading"><h2>线路</h2></div>
            <div id="line-list" class="choice-list" aria-label="播放线路"></div>

            <div class="episode-heading"><h2><span id="episode-title">选集</span> <span id="episode-count"></span></h2><button id="episode-order" class="text-button">倒序</button></div>
            <div id="episode-list" class="episode-list" aria-label="集数列表"></div>
            <button id="more-episodes" class="text-button full-width" hidden>显示更多集数</button>
            <label class="autoplay-setting"><input id="auto-next" type="checkbox" checked>自动播放下一集</label>
          </aside>
          <div class="description-panel"><h2>简介</h2><p class="watch-description" id="watch-description"></p></div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="configs-dialog" class="dialog sources-dialog">
    <div class="dialog-header"><div><h2>TVBox 配置</h2></div><button class="icon-button dialog-close" aria-label="关闭配置管理"><svg><use href="#i-close"/></svg></button></div>
    <p class="dialog-caption">添加配置，发现更多影片。</p>
    <form id="config-form"><label for="config-url">配置或片源地址</label><div class="url-input-row"><input id="config-url" type="url" required placeholder="https://…/config.json" autocomplete="off"><button id="config-submit" class="button primary" type="submit">导入</button></div></form>
    <p class="config-format-note">支持 TVBox、MoonTV、LibreTV 配置及影视接口。</p><p id="config-message" class="form-message" role="status" aria-live="polite"></p>
    <div id="config-dialog-list" class="source-list"></div>
    <p class="config-reference"><a id="config-reference" href="https://github.com/qist/tvbox#readme" target="_blank" rel="noopener noreferrer">配置说明 ↗</a></p>
  </dialog>
  <dialog id="direct-dialog" class="dialog direct-dialog">
    <div class="dialog-header"><div><h2>打开播放链接</h2></div><button class="icon-button dialog-close" aria-label="关闭链接播放"><svg><use href="#i-close"/></svg></button></div>
    <p class="dialog-caption">粘贴视频链接，直接开始观看。</p>
    <form id="direct-form"><label for="direct-url">视频地址</label><input id="direct-url" type="url" required placeholder="https://…/video.m3u8" autocomplete="off"><p id="direct-message" class="form-message" role="status"></p><button class="button primary full-width" type="submit"><svg><use href="#i-play"/></svg>开始播放</button></form>
  </dialog>
  <dialog id="history-choice" class="dialog"><div class="dialog-header"><h2 id="history-choice-title"></h2></div><p id="history-choice-message" class="dialog-caption"></p><div id="history-choice-actions" class="history-choice-actions"></div></dialog>
</body>
</html>
