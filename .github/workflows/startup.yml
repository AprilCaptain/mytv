name: Build, test and release My TV
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/publish-release.mjs --verify-tag
      - name: Prepare project dependencies through macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        env:
          MYTV_SETUP_ONLY: '1'
        run: /bin/zsh "启动 My TV.command"
      - name: Prepare project dependencies through Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MYTV_SETUP_ONLY: '1'
        run: call "启动 My TV.cmd"
      - name: Check environment and run tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run doctor
          npm run check
          npm test
      - name: Windows launcher syntax and legacy PowerShell argument checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MYTV_LAUNCH_ROOT = $PWD.Path
          $env:MYTV_TEST_NODE = (Get-Command node).Source
          & ([ScriptBlock]::Create([IO.File]::ReadAllText((Join-Path $PWD 'test/windows-launcher.ps1'))))
      - name: Check environment and run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call npm run doctor
          if errorlevel 1 exit /b 1
          call npm run check
          if errorlevel 1 exit /b 1
          call npm test
      - name: Build and package native launcher
        run: npm run package:launcher
      - name: Verify macOS native executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "./My TV.app/Contents/MacOS/MyTV" --self-test "$RUNNER_TEMP/mytv-launcher.json"
          cat "$RUNNER_TEMP/mytv-launcher.json"
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/mytv-launcher.json"));if(v.start.lan!==false||v.icon!==true)throw Error("Invalid native boolean");'
          lipo -info "My TV.app/Contents/MacOS/MyTV"
          node --input-type=module -e 'import fs from "node:fs";if(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/mytv-launcher.json")).version!==JSON.parse(fs.readFileSync("package.json")).version)throw Error("Invalid launcher version");'
      - name: Verify Windows native executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'mytv-launcher.json'
          $exe = Join-Path $PWD 'My TV.exe'
          $result = Start-Process -FilePath $exe -ArgumentList @('--self-test', ('"' + $output + '"')) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Native launcher self-test failed' }
          $value = Get-Content $output -Raw | ConvertFrom-Json
          if ($value.start.lan -isnot [bool] -or $value.start.lan) { throw 'Invalid native boolean' }
          if ($value.icon -ne $true) { throw 'Missing native icon' }
          if ($value.version -ne (Get-Content package.json -Raw | ConvertFrom-Json).version) { throw 'Invalid launcher version' }
          Get-Content $output
      - uses: actions/upload-artifact@v4
        with:
          name: My-TV-${{ runner.os }}
          path: dist/My-TV-${{ runner.os }}.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: startup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: My-TV-*
          merge-multiple: true
          path: dist
      - name: Publish both platforms after all checks succeed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
